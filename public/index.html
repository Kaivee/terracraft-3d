<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Search any real-world location and explore its terrain as an interactive 3D voxel map. Powered by open elevation data and Three.js.">
  <meta name="theme-color" content="#22342a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='m8 3 4 8 5-5 5 15H2L8 3z' fill='%23d9a05b'/></svg>">
  <title>TerraCraft 3D — Voxel Terrain Explorer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Fraunces:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Inline SVG icon sprite -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="icon-mountain" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="m8 3 4 8 5-5 5 14H2L8 3z"/>
  </symbol>
  <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="7"/>
    <path d="M21 21l-4.35-4.35"/>
  </symbol>
  <symbol id="icon-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 10.5 12 3l9 7.5"/>
    <path d="M5 9.5V21h5v-6h4v6h5V9.5"/>
  </symbol>
  <symbol id="icon-top" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3v12"/>
    <path d="m6 9 6-6 6 6"/>
    <path d="M5 21h14"/>
  </symbol>
  <symbol id="icon-iso" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
    <path d="m3.3 7 8.7 5 8.7-5"/>
    <path d="M12 22V12"/>
  </symbol>
  <symbol id="icon-walk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 4a2 2 0 1 0-2 2 2 2 0 0 0 2-2Z"/>
    <path d="m7 21 3-9"/>
    <path d="m10 21 1-7h4"/>
    <path d="M5 9l3-1 1 3"/>
  </symbol>
  <symbol id="icon-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 8h3l2-3h6l2 3h3v11H4V8z"/>
    <circle cx="12" cy="13.5" r="3.2"/>
  </symbol>
  <symbol id="icon-water" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.7 6.6 8.8a5.6 5.6 0 1 0 10.8 0L12 2.7z"/>
  </symbol>
  <symbol id="icon-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 21.5S5 16.4 5 10.5a7 7 0 1 1 14 0c0 5.9-7 11-7 11z"/>
    <circle cx="12" cy="10.5" r="2.6"/>
  </symbol>
  <symbol id="icon-locate" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="7.5"/>
    <path d="M12 2v3.5M12 18.5V22M2 12h3.5M18.5 12H22"/>
    <circle cx="12" cy="12" r="1.8"/>
  </symbol>
  <symbol id="icon-graph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 20h18"/>
    <path d="M6 20v-6"/>
    <path d="M12 20V4"/>
    <path d="M18 20V9"/>
  </symbol>
  <symbol id="icon-bookmark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 3h12v18l-6-4.5L6 21V3z"/>
  </symbol>
  <symbol id="icon-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="18" cy="5" r="2.6"/>
    <circle cx="6" cy="12" r="2.6"/>
    <circle cx="18" cy="19" r="2.6"/>
    <path d="m8.6 13.5 6.8 4"/>
    <path d="m15.4 6.5-6.8 4"/>
  </symbol>
  <symbol id="icon-dice" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="16" height="16" rx="3"/>
    <circle cx="8.5" cy="8.5" r="1.1"/>
    <circle cx="15.5" cy="8.5" r="1.1"/>
    <circle cx="8.5" cy="15.5" r="1.1"/>
    <circle cx="15.5" cy="15.5" r="1.1"/>
    <circle cx="12" cy="12" r="1.1"/>
  </symbol>
  <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 6l12 12M18 6 6 18"/>
  </symbol>
</svg>

<div id="viewport" class="viewport"></div>

<header id="topbar" class="topbar">
  <div id="brand" class="brand" role="button" tabindex="0" title="Back to home">
    <svg class="icon brand-icon"><use href="#icon-mountain"/></svg>
    <span class="brand-name">TERRA<span class="brand-accent">CRAFT</span></span>
  </div>
  <div id="search-wrap"></div>
  <button id="panel-toggle" class="panel-toggle" type="button" aria-expanded="true">Terrain Lab</button>
</header>

<div id="panel" class="panel"></div>

<footer id="hud" class="hud"></footer>

<div id="welcome" class="overlay welcome"></div>
<div id="loading" class="overlay loading" hidden>
  <div class="loading-card">
    <div class="spinner" aria-hidden="true"></div>
    <div class="loading-track"><div id="loading-bar" class="loading-bar"></div></div>
    <div id="loading-text" class="loading-text">Loading…</div>
  </div>
</div>
<div id="profile-overlay" class="overlay profile-overlay hidden" hidden></div>
<div id="pov-hud" class="overlay pov-hud" hidden></div>
<div id="toast-root" class="toast-root"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
  }
}
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
